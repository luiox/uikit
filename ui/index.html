<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nassistant</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="group-panel">
        <div class="panel-title">分组</div>
        <ul id="groupList" class="group-list"></ul>
      </aside>

      <main class="content-panel">
        <header class="toolbar">
          <input id="searchInput" type="text" placeholder="搜索当前分组条目..." />
          <button id="addBtn">新增</button>
          <button id="editBtn">编辑</button>
          <button id="deleteBtn" class="danger">删除</button>
          <button id="launchBtn" class="primary">启动</button>
        </header>

        <section class="item-area">
          <ul id="itemList" class="item-list"></ul>
        </section>

        <footer class="status-bar">
          <label class="checkbox-inline">
            <input type="checkbox" id="executeHide" />
            启动后隐藏主窗口
          </label>
          <span class="hotkey-wrap">
            快捷键：
            <input id="hotkeyInput" type="text" value="Alt+1" />
            <button id="saveSettingsBtn">保存设置</button>
          </span>
          <span id="statusText" class="status-text"></span>
        </footer>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
