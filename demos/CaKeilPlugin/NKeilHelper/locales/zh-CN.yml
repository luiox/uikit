zh-CN:
  app:
    name: "NKeilHelper"
    version: "版本: 0.1.0"
    description: "用于文件注释插入和模板处理的 Keil 助手工具"
    copyright: "Rust 版本的 CaKeilPlugin"
  
  commands:
    reset: "重置配置"
    info: "打印详细的帮助信息和 Logo"
    file_comment: "为指定文件添加文件注释"
    function_comment: "添加函数注释（尚未实现）"
    license_comment: "添加许可证注释（尚未实现）"
  
  args:
    file: "要添加注释的文件路径"
  
  success:
    comment_added: "成功为文件 '%{file}' 添加注释"
    config_reset: "重置配置"
  
  error:
    file_not_found: "文件不存在: %{file}"
    template_not_found: "模板文件 '%{template}' 未找到"
    cannot_get_filename: "无法获取文件名"
    cannot_read_file: "无法读取文件: %{file}"
    cannot_write_file: "无法写入文件: %{file}"
    encoding_error: "警告: 解码文件时遇到错误: %{file}"
    encoding_write_error: "警告: 编码文件时遇到错误: %{file}"
    cannot_get_current_dir: "无法获取当前工作目录"
    cannot_get_exe_path: "无法获取当前执行文件路径"
    cannot_get_exe_dir: "无法获取执行目录"
  
  help:
    usage_examples: "使用示例"
    example_reset: "nkeil-helper reset"
    example_info: "nkeil-helper info"
    example_file_comment: "nkeil-helper file-comment --file <文件路径>"
    example_function_comment: "nkeil-helper function-comment"
    example_license_comment: "nkeil-helper license-comment"
  
  status:
    adding_comment: "正在为文件添加注释: %{file}"
    not_implemented: "功能尚未实现"