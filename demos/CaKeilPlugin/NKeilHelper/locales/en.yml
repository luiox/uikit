en:
  app:
    name: "NKeilHelper"
    version: "Version: 0.1.0"
    description: "A Keil helper tool for file comment insertion and template processing"
    copyright: "Rust version of CaKeilPlugin"
  
  commands:
    reset: "Reset the configuration"
    info: "Print detailed help information with logo"
    file_comment: "Add file comment to the specified file"
    function_comment: "Add function comment (not implemented yet)"
    license_comment: "Add license comment (not implemented yet)"
  
  args:
    file: "Path to the file to add comments to"
  
  success:
    comment_added: "Successfully added comment to file '%{file}'"
    config_reset: "Reset the config"
  
  error:
    file_not_found: "File does not exist: %{file}"
    template_not_found: "Template file '%{template}' not found"
    cannot_get_filename: "Cannot get filename"
    cannot_read_file: "Cannot read file: %{file}"
    cannot_write_file: "Cannot write file: %{file}"
    encoding_error: "Warning: Error occurred while decoding file: %{file}"
    encoding_write_error: "Warning: Error occurred while encoding file: %{file}"
    cannot_get_current_dir: "Cannot get current working directory"
    cannot_get_exe_path: "Cannot get current executable path"
    cannot_get_exe_dir: "Cannot get executable directory"
  
  help:
    usage_examples: "Usage examples"
    example_reset: "nkeil-helper reset"
    example_info: "nkeil-helper info"
    example_file_comment: "nkeil-helper file-comment --file <FILE_PATH>"
    example_function_comment: "nkeil-helper function-comment"
    example_license_comment: "nkeil-helper license-comment"
  
  status:
    adding_comment: "Adding file comment to: %{file}"
    not_implemented: "Feature is not implemented yet"